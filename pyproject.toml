[project]
name = "explainable-hba1c-screening"
version = "0.1.0"
description = "Leakage-safe NHANES ensemble modelling for elevated HbA1c screening."
requires-python = ">=3.11,<3.15"
dependencies = [
  "numpy==2.5.2",
  "pandas==3.0.5",
  "scipy==1.18.0",
  "scikit-learn==1.9.0",
  "xgboost==3.4.0",
  "shap==0.52.0",
  "matplotlib==3.11.1",
  "seaborn==0.13.2",
  "streamlit==1.61.1",
  "tabulate==0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
